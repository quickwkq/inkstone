name: Build macOS installers
on:
  workflow_dispatch:
  push:
    branches: [main, feat/macos-distribution, feat/tauri-migration, feat/editor-typography, feat/neutral-system-theme]
  pull_request:
    branches: [main, feat/macos-distribution, feat/tauri-migration, feat/editor-typography]
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup show
      - run: npm ci
      - run: npm test && npm run test:native
      - run: npx tauri build --target ${{ matrix.target }}
      - run: node scripts/collect.mjs && npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: Inkstone-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
